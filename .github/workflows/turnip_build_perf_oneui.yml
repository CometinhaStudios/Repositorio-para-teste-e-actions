name: Build Turnip Perf + OneUI 8G2
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gcm: {description: Enable GCM, type: boolean, default: true}
      zelda: {description: Enable Zelda compatibility options, type: boolean, default: true}
      suballoc: {description: Use 512 KB suballocators, type: boolean, default: true}
      cache: {description: Use 4 GB shader cache, type: boolean, default: true}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip ccache
          pip3 install --break-system-packages meson mako
      - name: Compile
        env:
          OPT_GCM: ${{ inputs.gcm != false && '1' || '0' }}
          OPT_ZELDA: ${{ inputs.zelda != false && '1' || '0' }}
          OPT_SUBALLOC: ${{ inputs.suballoc != false && '1' || '0' }}
          OPT_CACHE: ${{ inputs.cache != false && '1' || '0' }}
        run: |
          chmod +x build_turnip_perf_oneui.sh
          ./build_turnip_perf_oneui.sh
      - name: Patch report
        if: always()
        run: |
          echo "### Patch report" >> "$GITHUB_STEP_SUMMARY"
          cat turnip_workdir/balemuni_perf_report.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: turnip-perf-oneui-8g2
          path: |
            turnip_workdir/Turnip-Perf-OneUI-8G2-*.zip
            turnip_workdir/balemuni_perf_report.txt
